<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}'; img-src {{CSP_SOURCE}} data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Personalization</title>
  <style>
    :root {
      color-scheme: light dark;
      --effective-icon-color: {{PREVIEW_FALLBACK_COLOR}};
      --panel-border: var(--vscode-panel-border, rgba(127, 127, 127, 0.35));
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--vscode-font-family);
      color: var(--vscode-editor-foreground);
      background:
        radial-gradient(circle at top right, rgba(120, 120, 120, 0.12), transparent 32%),
        linear-gradient(165deg, var(--vscode-editor-background), var(--vscode-sideBar-background));
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      display: grid;
      gap: 16px;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: color-mix(in srgb, var(--vscode-editor-background) 84%, var(--vscode-sideBar-background));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .header, .footer, .control-row, .control-head {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .header, .footer { justify-content: space-between; align-items: flex-start; }
    .summary { display: flex; gap: 14px; align-items: center; min-width: 0; }
    .summary-copy { min-width: 0; display: grid; gap: 8px; }
    .preview-frame {
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--vscode-focusBorder) 24%, transparent);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.14)), var(--vscode-input-background);
      color: var(--effective-icon-color);
    }

    .preview-glyph,
    .icon-button__glyph {
      display: grid;
      place-items: center;
      color: var(--effective-icon-color);
    }

    .preview-glyph { width: 44px; height: 44px; }
    .preview-glyph svg, .icon-button__glyph svg { width: 100%; height: 100%; display: block; }

    .eyebrow {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--vscode-descriptionForeground);
    }

    h1 { margin: 0; font-size: 22px; line-height: 1.18; word-break: break-word; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: color-mix(in srgb, var(--vscode-input-background) 80%, transparent);
      color: var(--vscode-descriptionForeground);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .control-block {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      background: color-mix(in srgb, var(--vscode-sideBar-background) 72%, transparent);
    }

    
    .control-block-input {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .control-block-input-single {
      flex-grow: 1;
    }

    .color-picker-shell {
      display: grid;
      gap: 10px;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .color-preview-swatch {
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      aspect-ratio: 1 / 1;
      border-radius: 9px;
      border: 1px solid var(--panel-border);
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.35), transparent 38%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.16)),
        var(--vscode-input-background);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 22px rgba(0, 0, 0, 0.14);
      position: relative;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
    }

    .color-preview-swatch::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--vscode-descriptionForeground), transparent 70%);
      opacity: 0.18;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .color-preview-swatch input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .color-picker-copy {
      min-width: 0;
      flex: 1 1 auto;
      display: grid;
      gap: 8px;
    }

    .color-picker-row .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .control-head {
      margin-bottom: 8px;
    }

    .control-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--vscode-descriptionForeground);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .control-row { min-width: 0; }

    .search-shell,
    input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 12px;
      background: var(--vscode-input-background);
    }

    input[type="text"] {
      padding: 10px 12px; color: var(--vscode-input-foreground); outline: none;
    }

    .search-shell { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; margin-bottom: 16px }
    .search-shell input {
      flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: var(--vscode-input-foreground); padding: 6px 6px 6px 6px; outline: none;
    }

    input[type="text"]:focus,
    input[type="search"]:focus,
    button:focus-visible,
    input[type="color"]:focus-visible { outline: 2px solid var(--vscode-focusBorder); outline-offset: 2px; }

    .icon-action {
      width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; padding: 0; border-radius: 12px; border: 1px solid var(--panel-border); background: transparent; color: var(--vscode-descriptionForeground); cursor: pointer;
    }
    .icon-action:hover:not(:disabled) { color: var(--vscode-editor-foreground); background: color-mix(in srgb, var(--vscode-input-background) 78%, transparent); }
    .icon-action:disabled { opacity: 0.45; cursor: default; }
    .icon-action svg { width: 16px; height: 16px; display: block; }

    .hint, .result-count, .message { font-size: 12px; color: var(--vscode-descriptionForeground); }
    .icon-grid {
      max-height: 360px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 48px));
      justify-content: start;
      gap: 8px;
      padding: 2px;
    }

    .icon-button {
      width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border-radius: 12px; border: 1px solid var(--panel-border); background: color-mix(in srgb, var(--vscode-input-background) 82%, transparent); color: inherit; cursor: pointer;
    }
    .icon-button:hover { border-color: color-mix(in srgb, var(--vscode-focusBorder) 42%, transparent); background: color-mix(in srgb, var(--vscode-input-background) 68%, transparent); }
    .icon-button.selected { border-color: var(--vscode-focusBorder); background: color-mix(in srgb, var(--vscode-focusBorder) 12%, var(--vscode-input-background)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--vscode-focusBorder) 28%, transparent); }
    .icon-button__glyph { width: 22px; height: 22px; pointer-events: none; }

    .empty-state {
      padding: 12px; border-radius: 12px; border: 1px dashed var(--panel-border); color: var(--vscode-descriptionForeground); background: color-mix(in srgb, var(--vscode-input-background) 74%, transparent);
    }

    .message[data-state="error"] { color: var(--vscode-errorForeground); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button.primary,
    button.ghost {
      min-height: 38px; padding: 9px 14px; border-radius: 12px; border: 1px solid transparent; font: inherit; cursor: pointer;
    }
    button.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
    button.primary:hover { background: var(--vscode-button-hoverBackground); }
    button.ghost { background: transparent; color: var(--vscode-editor-foreground); border-color: var(--panel-border); }

    @media (max-width: 780px) {
      .shell { padding: 12px; }
      .panel { padding: 14px; }
      .summary { flex-direction: column; align-items: stretch; }
      .control-row { flex-wrap: wrap; align-items: stretch; }
      .color-picker-row { grid-template-columns: 1fr; }
      .color-preview-swatch,
      .icon-action { flex-basis: 42px; }
      .search-shell, input[type="text"] { width: 100%; }
      .actions { width: 100%; }
      button.primary, button.ghost { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <header class="header">
        <div class="summary">
          <div class="preview-frame"><span id="previewGlyph" class="preview-glyph"></span></div>
          <div class="summary-copy">
            <p class="eyebrow">Shelfy Personalization</p>
            <h1>Edit {{LABEL_HTML}}</h1>
            <div class="chip-row">
              <span class="chip" id="previewMode"></span>
              <span class="chip" id="previewColor"></span>
              <span class="chip" id="previewIcon"></span>
            </div>
          </div>
        </div>
      </header>

      <section class="control-block">
        <div class="control-block-input">
        <div class="control-block-input-single">
            <label class="control-label" for="colorText">Color</label>
            <div class="color-picker-shell">
              <div class="color-picker-row">
                <label class="color-preview-swatch" id="colorPreviewSwatch" aria-label="Pick a color override">
                  <input id="colorPicker" type="color" aria-label="Pick a color override">
                </label>
                <div class="color-picker-copy">
                  <div class="control-row">
                    <input id="colorText" type="text" placeholder="#ff8800 or rgba(255, 136, 0, 0.8)">
                    <button id="clearColor" class="icon-action" type="button" title="Clear color override" aria-label="Clear color override">✕</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="hint">Pick visually or type a CSS color value.{{PROJECT_HINT}}</div>
        </div>

        <div class="control-block-input-single">
        <div class="control-head">
          <label class="control-label" for="iconSearch">Icon</label>
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="control-row">
          <div class="search-shell">
            <input id="iconSearch" type="search" placeholder="Search Font Awesome icons">
          </div>
          <button id="clearIcon" class="icon-action" type="button" title="Clear icon override" aria-label="Clear icon override">✕</button>
        </div>
        <div class="icon-grid" id="iconGrid"></div>
        <div class="empty-state" id="emptyState" hidden>No icons match that search.</div>
        </div>
        </div>
      </section>

      <footer class="footer">
        <div class="message" id="message" role="status" aria-live="polite"></div>
        <div class="actions">
          <button id="cancel" class="ghost" type="button">Cancel</button>
          <button id="save" class="primary" type="button">Save Personalization</button>
        </div>
      </footer>
    </section>
  </div>

  <script nonce="{{NONCE}}">
    const vscode = acquireVsCodeApi();
    const initialState = {{INITIAL_STATE_JSON}};
    const previewAssets = {{PREVIEW_ASSETS_JSON}};

    const previewGlyph = document.getElementById('previewGlyph');
    const previewMode = document.getElementById('previewMode');
    const previewColor = document.getElementById('previewColor');
    const previewIcon = document.getElementById('previewIcon');
    const colorPicker = document.getElementById('colorPicker');
    const colorText = document.getElementById('colorText');
    const clearColor = document.getElementById('clearColor');
    const iconSearch = document.getElementById('iconSearch');
    const clearIcon = document.getElementById('clearIcon');
    const iconGrid = document.getElementById('iconGrid');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const colorPreviewSwatch = document.getElementById('colorPreviewSwatch');
    const message = document.getElementById('message');
    const cancel = document.getElementById('cancel');
    const save = document.getElementById('save');
    const iconButtons = [];
    const iconMarkupByName = new Map();
    let loadedIconCount = 0;
    let iconCatalogReady = false;
    let iconSearchTimer = 0;

    const state = {
      icon: initialState.icon,
      search: '',
      colorText: initialState.color
    };

    colorText.value = state.colorText;
    colorPicker.value = getPickerColor(state.colorText);

    colorPicker.addEventListener('input', () => {
      state.colorText = colorPicker.value;
      colorText.value = state.colorText;
      clearMessage();
      renderAll();
    });

    colorText.addEventListener('input', () => {
      state.colorText = colorText.value;
      syncColorPicker();
      clearMessage();
      renderAll();
    });

    clearColor.addEventListener('click', () => {
      state.colorText = '';
      colorText.value = '';
      syncColorPicker();
      clearMessage();
      renderAll();
    });

    iconSearch.addEventListener('input', () => {
      window.clearTimeout(iconSearchTimer);
      iconSearchTimer = window.setTimeout(() => {
        state.search = iconSearch.value.trim().toLowerCase();
        applyIconFilter();
      }, 300);
    });

    clearIcon.addEventListener('click', () => {
      state.icon = null;
      clearMessage();
      renderAll();
    });

    cancel.addEventListener('click', () => {
      vscode.postMessage({ type: 'cancel' });
    });

    save.addEventListener('click', () => {
      const trimmedColor = colorText.value.trim();
      if (trimmedColor.length > 0 && !isCssColor(trimmedColor)) {
        setMessage('Enter a valid CSS color value before saving.', true);
        colorText.focus();
        return;
      }

      vscode.postMessage({ type: 'save', value: { color: trimmedColor, icon: state.icon } });
    });

    window.addEventListener('message', (event) => {
      if (!event.data) {
        return;
      }

      if (event.data.type === 'validationError') {
        setMessage(event.data.message, true);
        return;
      }

      if (event.data.type === 'iconBatch') {
        appendIconButtons(event.data.items || []);
        loadedIconCount = typeof event.data.loaded === 'number' ? event.data.loaded : loadedIconCount;
        iconCatalogReady = Boolean(event.data.done);
        updateIconSelection();
        applyIconFilter();
      }
    });

    window.addEventListener('error', (event) => {
      setMessage(event.message || 'Failed to render the personalization editor.', true);
    });

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || 'Unknown error');
      setMessage(reason, true);
    });

    vscode.postMessage({ type: 'ready' });
    renderAll();

    function renderAll() {
      updateEffectiveColor();
      renderPreview();
      renderColorPreview();
      clearColor.disabled = colorText.value.trim().length === 0;
      updateIconSelection();
      applyIconFilter();
    }

    function appendIconButtons(items) {
      if (!Array.isArray(items) || items.length === 0) {
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((icon) => {
        if (!icon || typeof icon.iconName !== 'string' || typeof icon.svgMarkup !== 'string') {
          return;
        }
        iconMarkupByName.set(icon.iconName, icon.svgMarkup);
        const button = createIconButton(icon);
        iconButtons.push(button);
        fragment.appendChild(button);
      });
      iconGrid.appendChild(fragment);
    }

    function renderPreview() {
      const preview = getPreviewState();
      previewGlyph.innerHTML = preview.svgMarkup;
      previewMode.textContent = preview.mode;
      previewColor.textContent = preview.colorLabel;
      previewIcon.textContent = preview.iconLabel;
    }

    function updateEffectiveColor() {
      document.documentElement.style.setProperty('--effective-icon-color', getEffectiveColor());
    }

    function renderColorPreview() {
      const previewColor = getValidColor(colorText.value)
        || getValidColor(initialState.projectConfigColor)
        || previewAssets.fallbackColor;

      colorPreviewSwatch.style.background = [
        'radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.35), transparent 38%)',
        'linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.16))',
        previewColor
      ].join(', ');
      colorPreviewSwatch.style.color = previewColor;
    }

    function createIconButton(icon) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'icon-button';
      button.title = icon.label;
      button.setAttribute('aria-label', icon.label + ': ' + icon.description);
      button.dataset.iconName = icon.iconName;
      button.dataset.searchText = [icon.iconName, icon.label, icon.description].join(' ').toLowerCase();
      button.addEventListener('click', () => {
        state.icon = icon.iconName;
        clearMessage();
        renderAll();
      });
      const glyph = document.createElement('span');
      glyph.className = 'icon-button__glyph';
      glyph.innerHTML = icon.svgMarkup;
      button.append(glyph);
      return button;
    }

    function updateIconSelection() {
      const selectedIconName = state.icon ?? '';
      clearIcon.disabled = state.icon === null;
      iconButtons.forEach((button) => {
        const selected = button.dataset.iconName === selectedIconName;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    function applyIconFilter() {
      const query = state.search;
      const visibleButtons = [];

      iconButtons.forEach((button) => {
        const matches = !query || button.dataset.searchText.includes(query);
        if (matches) {
          visibleButtons.push(button);
        }
      });

      iconGrid.replaceChildren(...visibleButtons);
      emptyState.hidden = visibleButtons.length > 0;
      resultCount.textContent = describeResults(visibleButtons.length, iconButtons.length);
    }

    function getPreviewState() {
      const overrideColor = getValidColor(colorText.value);
      const projectConfigColor = initialState.kind === 'project' ? getValidColor(initialState.projectConfigColor) : null;
      const effectiveColor = overrideColor || projectConfigColor || previewAssets.fallbackColor;

      if (state.icon) {
        return {
          svgMarkup: getIconMarkup(state.icon),
          color: effectiveColor,
          mode: 'Custom icon preview',
          colorLabel: describeColorLabel(overrideColor, projectConfigColor),
          iconLabel: 'Icon: fa-' + state.icon
        };
      }

      if (overrideColor || projectConfigColor) {
        return {
          svgMarkup: previewAssets.swatchSvg,
          color: overrideColor || projectConfigColor,
          mode: 'Color-only preview',
          colorLabel: describeColorLabel(overrideColor, projectConfigColor),
          iconLabel: previewAssets.defaultLabel
        };
      }

      return {
        svgMarkup: previewAssets.defaultSvg,
        color: previewAssets.fallbackColor,
        mode: 'Default preview',
        colorLabel: 'Color: none',
        iconLabel: previewAssets.defaultLabel
      };
    }

    function describeColorLabel(overrideColor, projectConfigColor) {
      if (overrideColor) {
        return 'Color: ' + overrideColor;
      }
      if (projectConfigColor) {
        return 'Project color: ' + projectConfigColor;
      }
      return 'Color: none';
    }

    function getEffectiveColor() {
      const overrideColor = getValidColor(colorText.value);
      const projectConfigColor = initialState.kind === 'project' ? getValidColor(initialState.projectConfigColor) : null;
      return overrideColor || projectConfigColor || previewAssets.fallbackColor;
    }

    function getIconMarkup(iconName) {
      if (iconMarkupByName.has(iconName)) {
        return iconMarkupByName.get(iconName);
      }
      if (initialState.icon === iconName && initialState.iconSvgMarkup) {
        return initialState.iconSvgMarkup;
      }
      return previewAssets.defaultSvg;
    }

    function getPickerColor(value) {
      return normalizeCssColorToHex(value)
        || normalizeCssColorToHex(initialState.kind === 'project' ? initialState.projectConfigColor : null)
        || previewAssets.fallbackColor;
    }

    function syncColorPicker() {
      colorPicker.value = getPickerColor(colorText.value);
    }

    function getValidColor(value) {
      if (typeof value !== 'string') {
        return null;
      }
      const trimmed = value.trim();
      return trimmed.length > 0 && isCssColor(trimmed) ? trimmed : null;
    }

    function isCssColor(value) {
      const option = document.createElement('option');
      option.style.color = '';
      option.style.color = value;
      return option.style.color !== '';
    }

    function normalizeCssColorToHex(value) {
      const validColor = getValidColor(value);
      if (!validColor) {
        return null;
      }
      const probe = document.createElement('span');
      probe.style.color = validColor;
      probe.style.display = 'none';
      document.body.appendChild(probe);
      const computed = getComputedStyle(probe).color;
      probe.remove();
      const match = computed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
      if (!match) {
        return null;
      }
      return '#' + [match[1], match[2], match[3]].map((component) => Number(component).toString(16).padStart(2, '0')).join('');
    }

    function describeResults(matchCount, totalCount) {
      if (!iconCatalogReady) {
        return 'Loading ' + loadedIconCount + ' / ' + previewAssets.totalIconCount + ' icons';
      }
      return state.search ? matchCount + ' / ' + totalCount + ' icons' : totalCount + ' icons';
    }

    function clearMessage() {
      setMessage('', false);
    }

    function setMessage(text, isError) {
      message.textContent = text;
      message.dataset.state = text ? (isError ? 'error' : 'info') : '';
    }
  </script>
</body>
</html>
