name: Publish VS Code Extension

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VERSION_BUMP: patch
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Marketplace token
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is required to publish the extension."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bump extension version
        id: version
        run: |
          npm version "$VERSION_BUMP" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile extension
        run: npm run compile

      - name: Package extension
        run: npx --yes @vscode/vsce@3 package --out extension.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath extension.vsix --pat "$VSCE_PAT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump extension version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main
